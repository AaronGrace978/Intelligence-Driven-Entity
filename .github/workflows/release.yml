name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf xdg-utils rpm file

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: v__VERSION__
          releaseName: The Entity v__VERSION__
          releaseBody: |
            Desktop builds of The Entity.

            | Platform | Asset |
            | --- | --- |
            | macOS Apple silicon | `.dmg` ending in `aarch64` |
            | macOS Intel | `.dmg` ending in `x64` |
            | Windows | `.msi` or the NSIS `-setup.exe` |
            | Linux x64 | `.deb`, `.rpm`, or `.AppImage` |
            | Linux arm64 | `.deb`, `.rpm`, or `.AppImage` |
            | Steam Deck | run the installer below in Konsole (Desktop Mode) |

            **Steam Deck:** this installs the latest x86_64 AppImage with an application-menu entry and a desktop icon. Run it again to update; add `--uninstall` to remove it.

            ```bash
            curl -fsSL https://github.com/AaronGrace978/Intelligence-Driven-Entity/releases/latest/download/install-steam-deck.sh | bash
            ```

            For Game Mode, right-click The Entity in the application menu, choose **Add to Steam**, and launch it from Non-Steam in your library. It opens full screen and works with the controller.

            macOS builds are ad-hoc signed and not notarized. If macOS says the app is damaged or from an unidentified developer, right-click it and choose Open, or allow it in System Settings → Privacy & Security. Windows builds are not Authenticode-signed.

            The Linux `.deb` needs WebKitGTK 4.1 (Ubuntu 22.04+ or Debian 12+). The `.AppImage` bundles its own runtime.
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Bundle WebKitGPUProcess into the AppImage
        if: runner.os == 'Linux'
        run: scripts/inject-webkit-gpu.sh

      - name: Replace the AppImage with the GPU-process build
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          gh release upload "v${{ steps.tauri.outputs.appVersion }}" "$appimage" --clobber

      - name: Attach the Steam Deck installer
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" scripts/install-steam-deck.sh --clobber
